---
- name: Configure Grub
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: Configure Grub
      ansible.builtin.import_role:
        name: grub
- name: Remove Unrequired Kernel Modules
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: Remove Unrequired Filesystem Kernel Modules
      ansible.builtin.import_role:
        name: kernel_modules
        tasks_from: filesystem-modules.yml
    - name: Remove Unrequired Network Kernel Modules
      ansible.builtin.import_role:
        name: kernel_modules
        tasks_from: network-modules.yml
- name: Configure Filesystem
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: Set Mount Options
      ansible.builtin.import_role:
        name: filesystem
        tasks_from: mount-options.yml
- name: Configure Security Limits
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: Configure Security Limits
      ansible.builtin.import_role:
        name: security
        tasks_from: limits.yml
- name: Configure Sysctl
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: Configure Sysctl
      ansible.builtin.import_role:
        name: sysctl
- name: Configure APT
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: Ensure Correct Services
      ansible.builtin.import_role:
        name: apt
        tasks_from: sources.yml
    - name: Ensure Correct Access
      ansible.builtin.import_role:
        name: apt
        tasks_from: directory-access.yml
    - name: Upgrade System
      ansible.builtin.apt:
        update_cache: true
        upgrade: safe
        autoremove: true
        autoclean: true
        purge: true
    - name: Ensure Installed
      ansible.builtin.import_role:
        name: apt
        tasks_from: ensure_installed.yml
    - name: Ensure Removed
      ansible.builtin.import_role:
        name: apt
        tasks_from: ensure_removed.yml
- name: Configure NTP
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: Configure chrony
      ansible.builtin.import_role:
        name: ntp
        tasks_from: chrony.yml
- name: Configure Schedulers
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: Configure cron
      ansible.builtin.import_role:
        name: cron
- name: Configure SSH
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: Configure SSH
      ansible.builtin.import_role:
        name: ssh
- name: Configure PAM
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: Configure PAM
      ansible.builtin.import_role:
        name: pam
- name: Configure User Accounts
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: Configure User Accounts
      ansible.builtin.import_role:
        name: user_accounts
- name: Configure Logging
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: Configure journald
      ansible.builtin.import_role:
        name: logging
        tasks_from: journald.yml
    - name: Configure Logfiles
      ansible.builtin.import_role:
        name: logging
        tasks_from: logfiles.yml
- name: Configure Integrity Checking
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: Configure AIDE
      ansible.builtin.import_role:
        name: aide
