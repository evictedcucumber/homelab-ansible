---
# CIS Debian Linux 13 Benchmark v1.0.0 - hardening baseline (the "base" playbook).
# Idempotent config only; it does NOT patch the OS - run
# playbooks/patch-debian-13.yml for that (CIS 1.2.2.1).
#
# One patch playbook per supported OS (patch-<os>-<ver>.yml) mirrors the
# os-<os>-<ver>.yml setup playbooks.
#
# A single play, so every role's handlers (grub regen, service restarts, the
# reboot) flush once at the end instead of once per section. Roles run in
# benchmark order; each import carries a section tag and every hardening task is
# tagged `cis`, `debian_13_cis`, `debian_13_cis_<id>` and `level1`/`level2` - the
# recommendation IDs are benchmark-namespaced so a role reused for another OS can
# carry that benchmark's IDs too. They live on the tags, not in task names:
#   ansible-playbook ... --tags section6
#   ansible-playbook ... --tags debian_13_cis_6.2
#   ansible-playbook ... --skip-tags level2
- name: Debian 13 hardening baseline
  hosts: debian_13
  gather_facts: true
  tags: [cis, debian_13_cis]
  tasks:
    # --- Initial setup ---
    - name: Filesystem and network kernel modules
      ansible.builtin.import_role:
        name: kernel_modules
      tags: [section1]
    - name: Filesystem partitions and mount options
      ansible.builtin.import_role:
        name: filesystem_mounts
    - name: Package Management
      tags: [section1]
      ansible.builtin.import_role:
        name: package_management
    - name: Mandatory access control - AppArmor
      ansible.builtin.import_role:
        name: apparmor
      tags: [section1]
    - name: Bootloader
      ansible.builtin.import_role:
        name: bootloader
      tags: [section1]
    - name: Additional process hardening
      ansible.builtin.import_role:
        name: process_hardening
      tags: [section1]
    - name: Command-line warning banners
      ansible.builtin.import_role:
        name: warning_banners
      tags: [section1]

    # --- Services ---
    - name: Server and client services
      ansible.builtin.import_role:
        name: services
      tags: [section2]
    - name: Time synchronization - chrony
      ansible.builtin.import_role:
        name: chrony
      tags: [section2]
    - name: Job schedulers - cron / at
      ansible.builtin.import_role:
        name: job_schedulers
      tags: [section2]

    # --- Network ---
    - name: Network and kernel parameters
      ansible.builtin.import_role:
        name: sysctl
      tags: [section3]

    # --- Access control ---
    - name: SSH server
      ansible.builtin.import_role:
        name: ssh_server
      tags: [section5]
    - name: Pluggable Authentication Modules
      ansible.builtin.import_role:
        name: pam
      tags: [section5]
    - name: User accounts and environment
      ansible.builtin.import_role:
        name: login_defs
      tags: [section5]

    # --- Logging and auditing ---
    - name: Journald client logging
      ansible.builtin.import_role:
        name: journald
      tags: [section6]
    - name: Logfile access
      ansible.builtin.import_role:
        name: logfiles
      tags: [section6]
    - name: System auditing - auditd
      ansible.builtin.import_role:
        name: auditd
      tags: [section6]
    - name: Integrity checking - AIDE
      ansible.builtin.import_role:
        name: aide
      tags: [section6]

    # --- System maintenance ---
    - name: System file and directory access
      ansible.builtin.import_role:
        name: system_file_perms
      tags: [section7]
    - name: Local user and group settings
      ansible.builtin.import_role:
        name: local_users_groups
      tags: [section7]
