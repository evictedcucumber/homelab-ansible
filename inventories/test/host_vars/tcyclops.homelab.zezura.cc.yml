---
ansible_ssh_private_key_file: ~/.ssh/ansible-control-node.key
ansible_ssh_public_key_file: ~/.ssh/ansible-control-node.key.pub
filesystem_mounts_block:
  - {path: /tmp, src: /dev/mapper/vg0-tmp, opts: 'defaults,rw,nosuid,nodev,noexec,relatime'}
  - {path: /home, src: /dev/mapper/vg0-home, opts: 'defaults,nosuid,nodev,relatime'}
  - {path: /var, src: /dev/mapper/vg0-var, opts: 'defaults,nosuid,nodev,relatime'}
  - {path: /var/tmp, src: /dev/mapper/vg0-vartmp, opts: 'defaults,nosuid,nodev,noexec,relatime'}
  - {path: /var/log, src: /dev/mapper/vg0-varlog, opts: 'defaults,nosuid,nodev,noexec,relatime'}
  - {path: /var/log/audit, src: /dev/mapper/vg0-audit, opts: 'defaults,nosuid,nodev,noexec,relatime'}
