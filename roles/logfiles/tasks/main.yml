---
# CIS Debian 13 Benchmark 6.1.3.1 - Ensure access to all logfiles is configured.
- name: Ensure access to log files in /var/log is configured
  ansible.builtin.script:
    cmd: var-log-permissions.sh
  register: logfiles_var_log
  changed_when: "'o No changes required' not in logfiles_var_log.stdout"
  tags: [cis, debian_13_cis, "debian_13_cis_6.1.3.1", level1]
