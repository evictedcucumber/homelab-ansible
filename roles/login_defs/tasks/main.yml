---
# CIS Debian 13 Benchmark 5.4 - User Accounts and Environment.

- name: Deploy /etc/login.defs
  ansible.builtin.copy:
    src: login.defs
    dest: /etc/login.defs
    owner: root
    group: root
    mode: "0644"
    backup: true
  tags:
    - cis
    - debian_13_cis
    - "debian_13_cis_5.4.1.1"
    - "debian_13_cis_5.4.1.2"
    - "debian_13_cis_5.4.1.3"
    - "debian_13_cis_5.4.1.4"
    - "debian_13_cis_5.4.3.3"
    - level1

- name: Deploy /etc/default/useradd
  ansible.builtin.copy:
    src: useradd
    dest: /etc/default/useradd
    owner: root
    group: root
    mode: "0644"
  tags: [cis, debian_13_cis, "debian_13_cis_5.4.1.5", level1]

- name: Ensure root primary group is GID 0
  ansible.builtin.user:
    name: root
    group: "0"
  tags: [cis, debian_13_cis, "debian_13_cis_5.4.2.2", level1]

- name: Ensure the root group has GID 0
  ansible.builtin.group:
    name: root
    gid: "0"
  tags: [cis, debian_13_cis, "debian_13_cis_5.4.2.3", level1]

- name: Deploy root shell environment (umask 027)
  ansible.builtin.copy:
    src: "root/{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - {src: profile, dest: /root/.profile}
    - {src: bashrc, dest: /root/.bashrc}
  tags: [cis, debian_13_cis, "debian_13_cis_5.4.2.6", level1]

- name: Deploy default user shell timeout and umask
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/profile.d/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [50-tmout.sh, 60-default_umask.sh]
  tags: [cis, debian_13_cis, "debian_13_cis_5.4.3.2", "debian_13_cis_5.4.3.3", level1]

- name: Ensure nologin is not listed in /etc/shells
  ansible.builtin.lineinfile:
    path: /etc/shells
    regexp: ^\s*([^#\n\r]+)?/nologin\b
    state: absent
  tags: [cis, debian_13_cis, "debian_13_cis_5.4.3.1", level2]

- name: Read root's shadow entry
  ansible.builtin.getent:
    database: shadow
    key: root
  tags: [cis, debian_13_cis, "debian_13_cis_5.4.2.4", level1]

- name: Verify root account has a password or is locked
  ansible.builtin.assert:
    quiet: true
    that: (ansible_facts.getent_shadow['root'][0] | default('')) | length > 0
    fail_msg: "root's password field is empty - it must be set or locked."
  tags: [cis, debian_13_cis, "debian_13_cis_5.4.2.4", level1]

- name: Set service accounts to nologin and lock shell-less accounts
  ansible.builtin.script:
    cmd: lock-nologin-accounts.sh
  register: login_defs_lock
  changed_when: "'ok - all service accounts' not in login_defs_lock.stdout"
  tags: [cis, debian_13_cis, "debian_13_cis_5.4.2.7", "debian_13_cis_5.4.2.8", level1]

- name: Audit root PATH integrity
  ansible.builtin.script:
    cmd: root-path-integrity.sh
  register: login_defs_root_path
  changed_when: false
  failed_when: "'** FAIL **' in login_defs_root_path.stdout"
  tags: [cis, debian_13_cis, "debian_13_cis_5.4.2.5", level1]
