---
# roles/login_defs - shadow-suite defaults and user environment
# (CIS Debian 13 section 5.4). Policy values live in the vendored files:
#   files/login.defs   - PASS_MAX_DAYS 365, PASS_MIN_DAYS 1, PASS_WARN_AGE 7,
#                        ENCRYPT_METHOD YESCRYPT, SHA_CRYPT_{MIN,MAX}_ROUNDS
#                        640000 (inert fallback + Lynis AUTH-9230),
#                        FAILLOG_ENAB yes, UMASK 027 (5.4.1.1-4, 5.4.3.3)
#   files/useradd      - INACTIVE=45 (5.4.1.5)
#   files/50-tmout.sh  - typeset -xr TMOUT=900 (5.4.3.2)
#   files/60-default_umask.sh, files/root/{profile,bashrc} - umask 027 (5.4.2.6)
login_defs_manage_root_env: true

# Vaulted yescrypt hash of root's *current* password, from `mkpasswd -m yescrypt`.
# ENCRYPT_METHOD only changes how the *next* password set is hashed, so a root
# hash predating the yescrypt switch stays sha512crypt ($6$) and keeps tripping
# 5.4.1.4 / Lynis AUTH-9229. Re-applying the same password as a yescrypt hash
# rewrites /etc/shadow once; the apply is idempotent thereafter. Empty = skip.
login_defs_root_password_hash: "{{ root_password_hash | default('') }}"
