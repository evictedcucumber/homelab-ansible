---
# roles/kernel_modules - deny-list unrequired kernel modules.
#
# Defaults track the CIS Debian Linux 13 Benchmark v1.0.0 sections 1.1.1
# (filesystem modules) and 3.2 (network modules). Each entry:
#   {name: <module>, cis: "<rec id>", level: 1|2, category: filesystem|network}
#
# NOT included and why:
#   overlay (1.1.1.6, L2) - required by container/overlayfs workloads (e.g. LXC
#     on Proxmox). Left loadable deliberately.
# The pre-D13 set also blacklisted cifs/nfs_common/nfsd/smbfs_common; dropped
# because they are not in the D13 v1.0.0 module list and a Proxmox host commonly
# mounts NFS/CIFS backup storage.

kernel_modules_modprobe_dir: /etc/modprobe.d
kernel_modules_confd_prefix: "60-"

kernel_modules_blacklist:
  # --- CIS 1.1.1 Filesystem kernel modules ---
  - {name: cramfs, cis: "1.1.1.1", level: 1, category: filesystem}
  - {name: freevxfs, cis: "1.1.1.2", level: 1, category: filesystem}
  - {name: hfs, cis: "1.1.1.3", level: 1, category: filesystem}
  - {name: hfsplus, cis: "1.1.1.4", level: 1, category: filesystem}
  - {name: jffs2, cis: "1.1.1.5", level: 1, category: filesystem}
  - {name: squashfs, cis: "1.1.1.7", level: 2, category: filesystem}
  - {name: udf, cis: "1.1.1.8", level: 2, category: filesystem}
  - {name: firewire-core, cis: "1.1.1.9", level: 1, category: filesystem}
  - {name: usb-storage, cis: "1.1.1.10", level: 1, category: filesystem}
  # --- CIS 3.2 Network kernel modules ---
  - {name: atm, cis: "3.2.1", level: 1, category: network}
  - {name: can, cis: "3.2.2", level: 1, category: network}
  - {name: dccp, cis: "3.2.3", level: 1, category: network}
  - {name: rds, cis: "3.2.4", level: 1, category: network}
  - {name: sctp, cis: "3.2.5", level: 1, category: network}
  - {name: tipc, cis: "3.2.6", level: 1, category: network}
