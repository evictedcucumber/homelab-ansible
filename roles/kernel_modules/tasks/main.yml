---
- name: Unload unrequired kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: absent
    persistent: absent
  loop: "{{ kernel_modules_blacklist }}"
- name: Deny loading of unrequired kernel modules
  ansible.builtin.template:
    src: blacklist.conf.j2
    dest: "/etc/modprobe.d/60-{{ item }}.conf"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ kernel_modules_blacklist }}"
