---
# roles/bootloader - GRUB2 hardening (CIS Debian 13 section 1.4).

# 1.4.2 - access to the generated grub config.
bootloader_grub_cfg_mode: "0600"

# Kernel command-line additions, appended (not replaced) to the Debian defaults
# via an /etc/default/grub.d drop-in. `lsm=` keeps AppArmor + Yama active.
bootloader_cmdline_default_extra:
  - lsm=capability,apparmor,yama
bootloader_cmdline_extra: []

# 1.4.1 - bootloader password. PBKDF2 hash from:
#   grub-mkpasswd-pbkdf2 --iteration-count=600000
# Store vaulted. While empty, 1.4.1 is not applied.
bootloader_password_hash: ""
bootloader_superuser: root

# Keep `--unrestricted` on the generated menuentries so the default entry still
# boots unattended (Ansible reconnects over SSH); the password then only guards
# interactive edit / the GRUB shell. Required on remote hosts.
bootloader_keep_unrestricted: true
