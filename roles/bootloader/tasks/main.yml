---
# CIS Debian 13 Benchmark 1.4 - Configure Bootloader.
- name: Load OS-specific variables
  ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', _ff) }}"
  vars:
    _ff:
      files:
        - "{{ ansible_facts['distribution'] }}_{{ ansible_facts['distribution_major_version'] }}.yml"
        - "{{ ansible_facts['os_family'] }}.yml"
        - main.yml
      paths: [vars]
  tags: [always]

- name: Deploy kernel command-line hardening drop-in
  ansible.builtin.template:
    src: 99-cis.cfg.j2
    dest: "{{ bootloader_default_grubd_dir }}/99-cis.cfg"
    owner: root
    group: root
    mode: "0644"
  notify: Update grub
  tags: [cis, debian_13_cis, "debian_13_cis_1.3.1.2", level1]

- name: Keep --unrestricted on generated menuentries
  ansible.builtin.replace:
    path: "{{ bootloader_linux_script }}"
    regexp: '^(CLASS="(?:(?!--unrestricted).)*?)"\s*$'
    replace: '\1 --unrestricted"'
  when: bootloader_keep_unrestricted
  notify: Update grub
  tags: [cis, debian_13_cis, "debian_13_cis_1.4.1", level1]

- name: Deploy bootloader password
  ansible.builtin.template:
    src: 40_cis_password.j2
    dest: "{{ bootloader_scripts_dir }}/40_cis_password"
    owner: root
    group: root
    mode: "0755"
  when: bootloader_password_hash | length > 0
  notify: Update grub
  tags: [cis, debian_13_cis, "debian_13_cis_1.4.1", level1]

- name: Report that the bootloader password is unset
  ansible.builtin.debug:
    msg: >-
      bootloader_password_hash is empty - the bootloader password is not applied.
      Generate a hash with `grub-mkpasswd-pbkdf2 --iteration-count=600000` and set
      it (vaulted).
  when: bootloader_password_hash | length == 0
  tags: [cis, debian_13_cis, "debian_13_cis_1.4.1", level1]

- name: Ensure access to the bootloader config is restricted
  ansible.builtin.file:
    path: "{{ bootloader_grub_cfg }}"
    state: file
    owner: root
    group: root
    mode: "{{ bootloader_grub_cfg_mode }}"
  tags: [cis, debian_13_cis, "debian_13_cis_1.4.2", level1]
