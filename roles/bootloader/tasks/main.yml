---
- name: Deploy Kernel Command-Line Hardening Drop-In
  ansible.builtin.template:
    src: 99-default.cfg.j2
    dest: "/etc/default/grub.d/99-default.cfg"
    owner: root
    group: root
    mode: "0644"
  notify: [Update Grub Config, Reboot]
- name: Keep --unrestricted on Generated Menuentries
  ansible.builtin.replace:
    path: "/etc/grub.d/10_linux"
    regexp: '^(CLASS="(?:(?!--unrestricted).)*?)"\s*$'
    replace: '\1 --unrestricted"'
  notify: [Update Grub Config, Reboot]
- name: Assert Bootloader Password Hash is a GRUB PBKDF2 SHA512 Hash
  ansible.builtin.assert:
    that:
      - bootloader_password_hash is string
      - bootloader_password_hash is match('^grub\\.pbkdf2\\.sha512\\.[0-9]+\\.[0-9A-Fa-f]+\\.[0-9A-Fa-f]+$')
    fail_msg: bootloader_password_hash must be a grub.pbkdf2.sha512.<rounds>.<salt>.<hash> value from grub-mkpasswd-pbkdf2
    quiet: true
  no_log: true
- name: Deploy Bootloader Password
  ansible.builtin.template:
    src: 40_cis_password.j2
    dest: "/etc/grub.d/40_cis_password"
    owner: root
    group: root
    mode: "0755"
  notify: [Update Grub Config, Reboot]
- name: Ensure Access to the Bootloader Config is Restricted
  ansible.builtin.file:
    path: "/boot/grub/grub.cfg"
    state: file
    owner: root
    group: root
    mode: "0600"
