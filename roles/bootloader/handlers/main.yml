---
# `Regenerate grub config` and `Reboot the host` are shared, by name, with the
# auditd and filesystem_mounts roles so that in a single play each collapses to
# one run no matter how many roles notify it.
- name: Regenerate grub config
  ansible.builtin.command: "{{ bootloader_update_command }}"
  changed_when: true
  listen: Update grub

- name: Reboot the host
  ansible.builtin.reboot:
  listen: Reboot
