---
# roles/filesystem_mounts - enforce separate partitions and hardened mount
# options (CIS Debian 13 Benchmark v1.0.0 section 1.1.2).
#
# The block-device mounts are host specific (device paths, filesystem type) and
# MUST be supplied per host via `filesystem_mounts_block` in group_vars/host_vars.
# The role ships only the universal /dev/shm tmpfs entry plus the CIS option
# policy so a consumer overriding a device does not have to restate the options.

# CIS option policy per mount point. `opts` on an entry overrides this.
filesystem_mounts_policy:
  /tmp: defaults,rw,nosuid,nodev,noexec,relatime
  /dev/shm: defaults,rw,nosuid,nodev,noexec,relatime
  /home: defaults,nosuid,nodev,relatime
  /var: defaults,nosuid,nodev,relatime
  /var/tmp: defaults,nosuid,nodev,noexec,relatime
  /var/log: defaults,nosuid,nodev,noexec,relatime
  /var/log/audit: defaults,nosuid,nodev,noexec,relatime

# Universal tmpfs mount (CIS 1.1.2.2.x).
filesystem_mounts_shm:
  path: /dev/shm
  src: tmpfs
  fstype: tmpfs
  opts: "{{ filesystem_mounts_policy['/dev/shm'] }}"

# Host-provided block-device mounts (CIS 1.1.2.1 / 1.1.2.3-7). Each entry:
#   {path: /var, src: /dev/mapper/vg0-var, fstype: ext4, opts: <optional>}
filesystem_mounts_block: []
