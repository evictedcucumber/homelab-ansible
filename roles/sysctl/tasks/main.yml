---
- name: Ensure /etc/sysctl.d Exists
  ansible.builtin.file:
    path: /etc/sysctl.d
    state: directory
    mode: '0644'
    owner: root
    group: root
- name: Set Sysctl Config
  ansible.posix.sysctl:
    name: '{{ item.key }}'
    value: '{{ item.value | string }}'
    sysctl_file: '{{ sysctl_files[item.key | split(".") | first] }}'
    sysctl_set: true
    state: present
    reload: true
  loop: '{{ sysctl_config | flatten_dict | dict2items }}'
