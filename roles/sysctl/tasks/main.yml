---
- name: Ensure sysctl Drop-In Directories Exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ sysctl_hardening_files.values() | map('dirname') | unique | list }}"
- name: Find Stray Files in the Drop-In Directories
  ansible.builtin.find:
    paths: "{{ sysctl_hardening_files.values() | map('dirname') | unique | list }}"
    excludes: "{{ sysctl_hardening_files.values() | map('basename') | list }}"
    hidden: true
    file_type: any
  register: sysctl_stray
- name: Remove Stray Files in the Drop-In Directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ sysctl_stray.files }}"
  loop_control:
    label: "{{ item.path }}"
  notify: Reboot
- name: Apply Hardening Kernel Parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value | string }}"
    sysctl_file: "{{ sysctl_hardening_files[item.key | split('.') | first] }}"
    sysctl_set: true
    state: present
    reload: true
  loop: "{{ sysctl_hardening | flatten_dict | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  notify: Reboot
