---
sysctl_hardening_files:
  dev: /etc/sysctl.d/20-dev.conf
  fs: /etc/sysctl.d/20-fs.conf
  kernel: /etc/sysctl.d/20-kernel.conf
  net: /etc/sysctl.d/20-network.conf
sysctl_hardening:
  dev:
    tty:
      ldisc_autoload: 0
  net:
    core:
      bpf_jit_harden: 2
    ipv4:
      ip_forward: 0
      conf:
        all:
          forwarding: 0
          send_redirects: 0
          accept_redirects: 0
          secure_redirects: 0
          # rp_filter: 1  # TODO: always shows changed
          accept_source_route: 0
          log_martians: 1
        default:
          forwarding: 0
          send_redirects: 0
          accept_redirects: 0
          secure_redirects: 0
          # rp_filter: 1  # TODO: always shows changed
          accept_source_route: 0
          log_martians: 1
      icmp_ignore_bogus_error_responses: 1
      icmp_echo_ignore_broadcasts: 1
      tcp_syncookies: 1
    ipv6:
      conf:
        lo:
          disable_ipv6: 1
        default:
          disable_ipv6: 1
        all:
          disable_ipv6: 1
  fs:
    protected_hardlinks: 1
    protected_symlinks: 1
    # protected_fifos: 2  # TODO: always shows changed
    protected_regular: 2
    suid_dumpable: 0
  kernel:
    yama:
      ptrace_scope: 3
    dmesg_restrict: 1
    kptr_restrict: 2
    randomize_va_space: 2
    apparmor_restrict_unprivileged_unconfined: 1
    unprivileged_bpf_disabled: 2
