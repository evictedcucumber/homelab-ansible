---
# roles/apparmor - Mandatory Access Control via AppArmor (CIS Debian 13 1.3.1).
# Note: 1.3.1.4 (kernel.apparmor_restrict_unprivileged_unconfined = 1) is owned
# by the `sysctl` role; the `bootloader` role keeps AppArmor in `lsm=` (1.3.1.2).

apparmor_packages: [apparmor, apparmor-utils]
apparmor_service: apparmor

# 1.3.1.3 (L2) - put every profile into enforce mode. Can disrupt applications
# with only a complain-mode profile; set false to leave profiles as-is.
apparmor_enforce_all: true
