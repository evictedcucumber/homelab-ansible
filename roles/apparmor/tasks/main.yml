---
- name: Gather AppArmor Facts
  ansible.builtin.setup:
    gather_subset: apparmor
- name: Ensure AppArmor Packages are Installed
  ansible.builtin.apt:
    name: [apparmor, apparmor-utils]
    state: present
- name: Ensure the AppArmor Service is Enabled and Running
  ansible.builtin.systemd_service:
    name: apparmor
    enabled: true
    state: started
- name: Verify AppArmor is Enabled in the Kernel
  ansible.builtin.assert:
    that: ansible_facts.apparmor.status == 'enabled'
    fail_msg: AppArmor is not enabled in the running kernel (/sys/kernel/security/apparmor is missing).
    success_msg: AppArmor is enabled in the running kernel.
- name: Read Currently Loaded AppArmor Profiles
  ansible.builtin.slurp:
    src: /sys/kernel/security/apparmor/profiles
  register: apparmor_loaded_profiles
- name: Determine AppArmor Profiles Still in Complain Mode
  ansible.builtin.set_fact:
    apparmor_complain_profiles: "{{ (apparmor_loaded_profiles.content | b64decode).splitlines() | select('match', '.*\\(complain.*\\)$') | map('regex_replace',\
      \ '\\s+\\([^)]*\\)$', '') | list }}"
- name: Set Complain-Mode AppArmor Profiles to Enforce
  ansible.builtin.command: "aa-enforce {{ item }}"
  loop: "{{ apparmor_complain_profiles }}"
  loop_control:
    label: "{{ item }}"
  register: apparmor_enforce
  changed_when: "'Setting' in apparmor_enforce.stdout"
  failed_when: false
