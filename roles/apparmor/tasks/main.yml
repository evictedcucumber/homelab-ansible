---
# CIS Debian 13 Benchmark 1.3.1 - Configure AppArmor.
- name: Ensure AppArmor packages are installed
  ansible.builtin.apt:
    name: "{{ apparmor_packages }}"
    state: present
  tags: [cis, debian_13_cis, "debian_13_cis_1.3.1.1", level1]

- name: Ensure the AppArmor service is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ apparmor_service }}"
    enabled: true
    state: started
  tags: [cis, debian_13_cis, "debian_13_cis_1.3.1.2", level1]

- name: Verify AppArmor is enabled in the kernel
  ansible.builtin.command: aa-enabled
  register: apparmor_enabled
  changed_when: false
  failed_when: "'Yes' not in apparmor_enabled.stdout"
  tags: [cis, debian_13_cis, "debian_13_cis_1.3.1.2", level1]

- name: Set all AppArmor profiles to enforce mode
  ansible.builtin.command: aa-enforce /etc/apparmor.d/
  register: apparmor_enforce
  changed_when: "'Setting' in apparmor_enforce.stdout"
  when: apparmor_enforce_all
  tags: [cis, debian_13_cis, "debian_13_cis_1.3.1.3", level2]
