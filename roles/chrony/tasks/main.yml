---
- name: Ensure Conflicting Time-Sync Packages are Removed
  ansible.builtin.apt:
    name: "{{ chrony_conflicting_packages }}"
    state: absent
    purge: true
    autoremove: true
- name: Ensure chrony is Installed
  ansible.builtin.apt:
    name: "chrony"
    state: present
- name: Ensure chrony Configuration Directory Exists
  ansible.builtin.file:
    path: "/etc/chrony"
    state: directory
    owner: root
    group: root
    mode: "0755"
- name: Deploy chrony Configuration
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: "/etc/chrony/chrony.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart chrony
- name: Find Stray Files in the chrony Configuration Directory
  ansible.builtin.find:
    paths: "/etc/chrony"
    excludes: ["chrony.conf"]
    hidden: true
    file_type: any
  register: chrony_stray
- name: Remove Stray Files in the chrony Configuration Directory
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ chrony_stray.files }}"
  loop_control:
    label: "{{ item.path }}"
  notify: Restart chrony
- name: Ensure chrony Service is Unmasked, Enabled, and Running
  ansible.builtin.systemd_service:
    name: "chrony"
    masked: false
    enabled: true
    state: started
