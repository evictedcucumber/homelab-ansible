---
# roles/ssh_server - OpenSSH server hardening (CIS Debian 13 section 5.1).
#
# Deviation: 5.1.21 wants PermitRootLogin=no. This host is administered as root
# over SSH by Ansible, so key-only root login is kept (prohibit-password) and
# 5.1.21 is a documented :black_circle:.

# sshd_config directives rendered as "key value", one per line.
ssh_server_config:
  PermitRootLogin: prohibit-password        # 5.1.21 (deviation)
  PasswordAuthentication: "no"
  PubkeyAuthentication: "yes"
  PermitEmptyPasswords: "no"                # 5.1.20
  PermitUserEnvironment: "no"               # 5.1.22
  UsePAM: "yes"                             # 5.1.23
  GSSAPIAuthentication: "no"                # 5.1.9
  HostbasedAuthentication: "no"             # 5.1.10
  IgnoreRhosts: "yes"                       # 5.1.11
  DisableForwarding: "yes"                  # 5.1.8
  LoginGraceTime: "60"                      # 5.1.14
  LogLevel: "VERBOSE"                       # 5.1.15
  MaxAuthTries: "4"                         # 5.1.17
  MaxSessions: "10"                         # 5.1.18
  MaxStartups: "10:30:60"                   # 5.1.19
  ClientAliveInterval: "15"                 # 5.1.7
  ClientAliveCountMax: "3"                  # 5.1.7
  Banner: "/etc/issue.net"                  # 5.1.5
  PrintMotd: "no"
  AuthorizedKeysFile: ".ssh/authorized_keys"

# 5.1.6 / 5.1.12 / 5.1.13 / 5.1.16 - strong-only algorithm allowlists (no weak
# algorithm from the CIS "excluded" lists is present; post-quantum KEX first).
ssh_server_ciphers:
  - chacha20-poly1305@openssh.com
  - aes256-gcm@openssh.com
  - aes128-gcm@openssh.com
  - aes256-ctr
  - aes192-ctr
  - aes128-ctr
ssh_server_kex_algorithms:
  - mlkem768x25519-sha256
  - sntrup761x25519-sha512
  - curve25519-sha256
  - curve25519-sha256@libssh.org
  - diffie-hellman-group16-sha512
  - diffie-hellman-group18-sha512
  - diffie-hellman-group14-sha256
ssh_server_macs:
  - hmac-sha2-512-etm@openssh.com
  - hmac-sha2-256-etm@openssh.com

# 5.1.4 - at least one of Allow/Deny Users/Groups.
ssh_server_allow_users: [root]
ssh_server_allow_groups: []
ssh_server_deny_users: []
ssh_server_deny_groups: []

# Extra verbatim lines appended to sshd_config.
ssh_server_extra_config: []

# Install the Ansible control-node key into root's authorized_keys.
ssh_server_authorize_control_key: true
