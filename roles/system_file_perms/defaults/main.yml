---
# Files under /var/log created 0644 by dpkg/installer; CIS 6.1.3.1 needs <= 0640
system_file_perms_var_log_files:
  - /var/log/dpkg.log
  - /var/log/alternatives.log
  - /var/log/installer/status
  - /var/log/installer/hardware-summary
  - /var/log/installer/lsb-release
  - /var/log/installer/firmware-summary
# logrotate configs whose `create` directive would recreate the logs as 0644
system_file_perms_logrotate_configs:
  - {path: /etc/logrotate.d/dpkg, mode: "0640"}
  - {path: /etc/logrotate.d/alternatives, mode: "0640"}
