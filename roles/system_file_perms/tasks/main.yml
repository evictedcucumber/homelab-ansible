---
- name: Ensure Access to passwd/group/shells Files is Configured
  ansible.builtin.file:
    path: "/etc/{{ item }}"
    state: file
    owner: root
    group: root
    mode: "0644"
  loop: [passwd, passwd-, group, group-, shells]
- name: Ensure Access to shadow/gshadow Files is Configured
  ansible.builtin.file:
    path: "/etc/{{ item }}"
    state: file
    owner: root
    group: shadow
    mode: "0640"
  loop: [shadow, gshadow]
# SSG requires the backups to be mode 0000 (stricter than the CIS 0640), with
# group shadow on shadow- but root on gshadow-. Shadow tools copy the live
# file's owner/mode when they write the backup, so re-assert on every run.
- name: Ensure Access to shadow-/gshadow- Backups is Configured
  ansible.builtin.file:
    path: "/etc/{{ item.name }}"
    state: file
    owner: root
    group: "{{ item.group }}"
    mode: "0000"
  loop:
    - {name: shadow-, group: shadow}
    - {name: gshadow-, group: root}
  loop_control:
    label: "{{ item.name }}"
- name: Check for /etc/security/opasswd and its Backup
  ansible.builtin.stat:
    path: "/etc/security/{{ item }}"
  register: system_file_perms_opasswd
  loop: [opasswd, opasswd.old]
- name: Ensure Access to /etc/security/opasswd is Configured
  ansible.builtin.file:
    path: "/etc/security/{{ item.item }}"
    state: file
    owner: root
    group: root
    mode: "0600"
  loop: "{{ system_file_perms_opasswd.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists
- name: Check for Log Files Created World-Readable by dpkg and the Installer
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: system_file_perms_var_log_stat
  loop: "{{ system_file_perms_var_log_files }}"
- name: Ensure /var/log Files are not Group-Writable or Accessible by Others
  ansible.builtin.file:
    path: "{{ item.item }}"
    state: file
    mode: "g-w,o-rwx"
  loop: "{{ system_file_perms_var_log_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists
- name: Ensure logrotate Recreates dpkg/alternatives Logs with Mode 0640
  ansible.builtin.lineinfile:
    path: "{{ item.path }}"
    regexp: '^(\s*)create\s+[0-7]{3,4}\s+root\s+root\s*$'
    line: '\1create {{ item.mode | regex_replace("^0", "") }} root root'
    backrefs: true
  loop: "{{ system_file_perms_logrotate_configs }}"
  loop_control:
    label: "{{ item.path }}"
