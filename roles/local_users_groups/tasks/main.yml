---
# CIS Debian 13 Benchmark 7.2 - Local User and Group Settings.
# Also covers the account-database audits from 5.4.1.6 and 5.4.2.1.

- name: Audit the shadow password suite (root UID 0, change dates)
  ansible.builtin.script:
    cmd: shadow-suite-audit.sh
  register: local_users_groups_shadow
  changed_when: false
  failed_when: "'** FAIL **' in local_users_groups_shadow.stdout"
  tags: [cis, debian_13_cis, "debian_13_cis_5.4.1.6", "debian_13_cis_5.4.2.1", level1]

- name: Verify local user and group database consistency
  ansible.builtin.script:
    cmd: user-group-audit.sh
  register: local_users_groups_db
  changed_when: false
  failed_when: "'** FAIL **' in local_users_groups_db.stdout"
  tags:
    - cis
    - debian_13_cis
    - "debian_13_cis_7.2.1"
    - "debian_13_cis_7.2.2"
    - "debian_13_cis_7.2.3"
    - "debian_13_cis_7.2.4"
    - "debian_13_cis_7.2.5"
    - "debian_13_cis_7.2.6"
    - "debian_13_cis_7.2.7"
    - "debian_13_cis_7.2.8"
    - "debian_13_cis_5.4.2.2"
    - "debian_13_cis_5.4.2.3"
    - level1

- name: Configure local interactive user home directories
  ansible.builtin.script:
    cmd: user-home-directories.sh
  register: local_users_groups_homes
  changed_when: >-
    'No modification needed to local interactive users home directories'
    not in local_users_groups_homes.stdout
  tags: [cis, debian_13_cis, "debian_13_cis_7.2.9", level1]

- name: Configure local interactive user dot-file access
  ansible.builtin.script:
    cmd: user-dot-files.sh
  register: local_users_groups_dotfiles
  changed_when: local_users_groups_dotfiles.stdout | trim | length > 0
  tags: [cis, debian_13_cis, "debian_13_cis_7.2.10", level1]
