---
# CIS Debian 13 Benchmark 6.1.3.1 - Ensure access to all logfiles has been configured.
- name: Ensure Access to Log Files in `/var/log` is Configured
  ansible.builtin.script:
    cmd: var-log-permissions.sh
  register: logging_var_log_perms
  changed_when: "'o No changes required' not in logging_var_log_perms.stdout"
