# Managed by Ansible - do not edit.
# CIS Debian 13 Benchmark 6.1.1.1 (journald is the chosen client-side logger).
#   6.1.1.1.3 Ensure journald log file rotation is configured
#   6.1.1.1.4 Ensure journald ForwardToSyslog is disabled
#   6.1.1.1.5 Ensure journald Storage is configured
#   6.1.1.1.6 Ensure journald Compress is configured
[Journal]
Storage=persistent
Compress=yes
ForwardToSyslog=no
SystemMaxUse=1G
SystemKeepFree=500M
RuntimeMaxUse=200M
RuntimeKeepFree=50M
MaxFileSec=1month
