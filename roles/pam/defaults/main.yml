---
# roles/pam - PAM hardening (CIS Debian 13 section 5.3). Debian pam-auth-update
# based; the policy values live in the vendored files under files/.

pam_packages:
  - libpam-runtime      # 5.3.1.1
  - libpam-modules      # 5.3.1.2
  - libpam-pwquality    # 5.3.1.3

# Install the latest available versions (5.3.1.x say "latest"). Set false to
# only ensure presence.
pam_update_packages: true
