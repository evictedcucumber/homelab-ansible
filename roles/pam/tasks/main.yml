---
- name: Ensure PAM Packages are Present
  ansible.builtin.apt:
    name: "{{ pam_packages }}"
    state: present
    update_cache: true
- name: Deploy pam-auth-update Profiles
  ansible.builtin.copy:
    src: "pam-configs/{{ item }}"
    dest: "/usr/share/pam-configs/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [faillock, faillock_notify, pwquality, pwhistory]
  notify: Reboot
- name: Deploy /etc/security/faillock.conf
  ansible.builtin.copy:
    src: faillock.conf
    dest: /etc/security/faillock.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reboot
- name: Ensure /etc/security/pwquality.conf.d Exists
  ansible.builtin.file:
    path: /etc/security/pwquality.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  notify: Reboot
- name: Deploy pwquality Policy
  ansible.builtin.copy:
    src: pwquality.conf.d/50-default.conf
    dest: /etc/security/pwquality.conf.d/50-default.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reboot
- name: Find Existing pwquality.conf.d Files
  ansible.builtin.find:
    paths: /etc/security/pwquality.conf.d
    excludes: ["50-default.conf"]
    file_type: file
  register: pam_pwquality_confd
- name: Remove Unmanaged pwquality.conf.d Files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ pam_pwquality_confd.files }}"
  loop_control:
    label: "{{ item.path }}"
  notify: Reboot
- name: Deploy /etc/security/pwhistory.conf
  ansible.builtin.copy:
    src: pwhistory.conf
    dest: /etc/security/pwhistory.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reboot
