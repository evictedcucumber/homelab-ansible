---
# CIS Debian 13 Benchmark 5.3 - Pluggable Authentication Modules.
# Debian-specific: uses pam-auth-update profiles under /usr/share/pam-configs/.

- name: Ensure PAM packages are current
  ansible.builtin.apt: # noqa: package-latest
    name: "{{ pam_packages }}"
    state: "{{ 'latest' if pam_update_packages else 'present' }}"
    update_cache: true
  tags: [cis, debian_13_cis, "debian_13_cis_5.3.1.1", "debian_13_cis_5.3.1.2", "debian_13_cis_5.3.1.3", level1]

# --- 5.3.2 pam-auth-update profiles ---
- name: Deploy pam-auth-update profiles
  ansible.builtin.copy:
    src: "pam-configs/{{ item }}"
    dest: "/usr/share/pam-configs/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [faillock, faillock_notify, pwquality, pwhistory]
  register: pam_profiles
  tags: [cis, debian_13_cis, "debian_13_cis_5.3.2.2", "debian_13_cis_5.3.2.3", "debian_13_cis_5.3.2.4", level1]

- name: Check which PAM modules are already enabled
  ansible.builtin.command: "grep -Pq -- '{{ item.module }}' {{ item.file }}"
  loop:
    - {name: unix, module: '\bpam_unix\.so\b', file: /etc/pam.d/common-auth}
    - {name: faillock, module: '\bpam_faillock\.so\b', file: /etc/pam.d/common-auth}
    - {name: pwquality, module: '\bpam_pwquality\.so\b', file: /etc/pam.d/common-password}
    - {name: pwhistory, module: '\bpam_pwhistory\.so\b', file: /etc/pam.d/common-password}
  loop_control:
    label: "{{ item.name }}"
  register: pam_enabled
  changed_when: false
  failed_when: false
  tags: [cis, debian_13_cis, "debian_13_cis_5.3.2.1", "debian_13_cis_5.3.2.2", "debian_13_cis_5.3.2.3", "debian_13_cis_5.3.2.4", level1]

- name: Enable required PAM modules
  ansible.builtin.command: "pam-auth-update --enable {{ item }}"
  loop: [unix, faillock, faillock_notify, pwquality, pwhistory]
  changed_when: true
  when: >-
    pam_profiles is changed
    or (pam_enabled.results | selectattr('rc', 'ne', 0) | list | length > 0)
  tags: [cis, debian_13_cis, "debian_13_cis_5.3.2.1", "debian_13_cis_5.3.2.2", "debian_13_cis_5.3.2.3", "debian_13_cis_5.3.2.4", level1]

# --- 5.3.3 module arguments ---
- name: Deploy /etc/security/faillock.conf
  ansible.builtin.copy:
    src: faillock.conf
    dest: /etc/security/faillock.conf
    owner: root
    group: root
    mode: "0644"
  tags: [cis, debian_13_cis, "debian_13_cis_5.3.3.1.1", "debian_13_cis_5.3.3.1.2", "debian_13_cis_5.3.3.1.3", level1]

- name: Ensure /etc/security/pwquality.conf.d exists
  ansible.builtin.file:
    path: /etc/security/pwquality.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [cis, debian_13_cis, "debian_13_cis_5.3.3.2", level1]

- name: Deploy pwquality policy
  ansible.builtin.copy:
    src: pwquality.conf.d/50-cis.conf
    dest: /etc/security/pwquality.conf.d/50-cis.conf
    owner: root
    group: root
    mode: "0644"
  tags: [cis, debian_13_cis, "debian_13_cis_5.3.3.2", level1]

- name: Find existing pwquality.conf.d files
  ansible.builtin.find:
    paths: /etc/security/pwquality.conf.d
    file_type: file
  register: pam_pwquality_confd
  tags: [cis, debian_13_cis, "debian_13_cis_5.3.3.2", level1]

- name: Remove unmanaged pwquality.conf.d files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ pam_pwquality_confd.files }}"
  loop_control:
    label: "{{ item.path }}"
  when: item.path | basename != '50-cis.conf'
  tags: [cis, debian_13_cis, "debian_13_cis_5.3.3.2", level1]

- name: Deploy /etc/security/pwhistory.conf
  ansible.builtin.copy:
    src: pwhistory.conf
    dest: /etc/security/pwhistory.conf
    owner: root
    group: root
    mode: "0644"
  tags: [cis, debian_13_cis, "debian_13_cis_5.3.3.3.1", "debian_13_cis_5.3.3.3.2", "debian_13_cis_5.3.3.3.3", level1]

# --- 5.3.3.4 pam_unix module arguments ---
- name: Read /etc/pam.d/common-password
  ansible.builtin.slurp:
    src: /etc/pam.d/common-password
  register: pam_common_password
  tags: [cis, debian_13_cis, "debian_13_cis_5.3.3.4.1", "debian_13_cis_5.3.3.4.2", "debian_13_cis_5.3.3.4.3", "debian_13_cis_5.3.3.4.4", level1]

- name: Extract the active pam_unix line
  ansible.builtin.set_fact:
    pam_unix_line: "{{ pam_common_password.content | b64decode | regex_findall('(?m)^[^#]*\\bpam_unix\\.so\\b.*$') | first | default('') }}"
  tags: [cis, debian_13_cis, "debian_13_cis_5.3.3.4.1", "debian_13_cis_5.3.3.4.2", "debian_13_cis_5.3.3.4.3", "debian_13_cis_5.3.3.4.4", level1]

- name: Assert pam_unix arguments meet policy
  ansible.builtin.assert:
    quiet: true
    that:
      - "'nullok' not in pam_unix_line"                          # 5.3.3.4.1
      - "'remember=' not in pam_unix_line"                       # 5.3.3.4.2
      - "'yescrypt' in pam_unix_line or 'sha512' in pam_unix_line"  # 5.3.3.4.3
      - "'use_authtok' in pam_unix_line"                         # 5.3.3.4.4
    fail_msg: "pam_unix in common-password violates password policy: '{{ pam_unix_line }}'"
  tags: [cis, debian_13_cis, "debian_13_cis_5.3.3.4.1", "debian_13_cis_5.3.3.4.2", "debian_13_cis_5.3.3.4.3", "debian_13_cis_5.3.3.4.4", level1]
