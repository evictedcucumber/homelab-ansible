---
- name: Copy `/etc/login.defs`
  ansible.builtin.copy:
    src: login.defs
    dest: /etc/login.defs
    owner: root
    group: root
    mode: '0644'
    backup: true
- name: Copy `/etc/default/useradd`
  ansible.builtin.copy:
    src: useradd
    dest: /etc/default/useradd
    owner: root
    group: root
    mode: '0644'
- name: Ensure `root` Account's Primary GID is 0
  ansible.builtin.user:
    name: root
    group: '0'
- name: Ensure `root` Group's GID is 0
  ansible.builtin.group:
    name: root
    gid: '0'
- name: Copy `/root/.profile`
  ansible.builtin.copy:
    src: root/profile
    dest: /root/.profile
    owner: root
    group: root
    mode: '0644'
- name: Copy `/root/.bashrc`
  ansible.builtin.copy:
    src: root/bashrc
    dest: /root/.bashrc
    owner: root
    group: root
    mode: '0644'
- name: Ensure `nologin` is Not Listed in `/etc/shells`
  ansible.builtin.lineinfile:
    path: /etc/shells
    regexp: ^\s*([^#\n\r]+)?/nologin\b
    state: absent
- name: Copy `/etc/profile.d/50-tmout.sh`
  ansible.builtin.copy:
    src: 50-tmout.sh
    dest: /etc/profile.d/50-tmout.sh
    owner: root
    group: root
    mode: '0644'
- name: Copy `/etc/profile.d/60-default_umask.sh`
  ansible.builtin.copy:
    src: 60-default_umask.sh
    dest: /etc/profile.d/60-default_umask.sh
    owner: root
    group: root
    mode: '0644'
