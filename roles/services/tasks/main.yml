---
# CIS Debian 13 Benchmark 2.1 (server services) and 2.2 (client services).

- name: Purge unwanted server and client packages
  ansible.builtin.apt:
    name: "{{ services_packages_absent }}"
    state: absent
    purge: true
    autoremove: true
  tags: [cis, debian_13_cis, "debian_13_cis_2.1", "debian_13_cis_2.2", "debian_13_cis_1.7.1", "debian_13_cis_3.1.3", level1, level2]

- name: Gather service facts
  ansible.builtin.service_facts:
  tags: [cis, debian_13_cis, "debian_13_cis_2.1.13", "debian_13_cis_2.1.22", level1]

- name: Mask the rsync daemon (keep the package)
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: true
    enabled: false
    state: stopped
  loop: [rsync.service, rsyncd.service]
  when:
    - services_rsync_mask
    - item in ansible_facts.services
  tags: [cis, debian_13_cis, "debian_13_cis_2.1.13", level1]

- name: Check for an installed MTA
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/sbin/exim4
    - /usr/sbin/postfix
  register: services_mta_bins
  when: services_mta_local_only
  tags: [cis, debian_13_cis, "debian_13_cis_2.1.22", level1]

- name: Bind exim4 to loopback only
  ansible.builtin.lineinfile:
    path: /etc/exim4/update-exim4.conf.conf
    regexp: '^dc_local_interfaces='
    line: "dc_local_interfaces='127.0.0.1 ; ::1'"
    create: false
  when:
    - services_mta_local_only
    - services_mta_bins.results[0].stat.exists | default(false)
  notify: Rebuild exim4 config
  tags: [cis, debian_13_cis, "debian_13_cis_2.1.22", level1]

- name: Bind postfix to loopback only
  ansible.builtin.command: postconf -e 'inet_interfaces = loopback-only'
  register: services_postfix_bind
  changed_when: services_postfix_bind.rc == 0
  when:
    - services_mta_local_only
    - services_mta_bins.results[1].stat.exists | default(false)
  notify: Restart postfix
  tags: [cis, debian_13_cis, "debian_13_cis_2.1.22", level1]

- name: Audit listening sockets
  ansible.builtin.command: ss -plntuH
  register: services_listening
  changed_when: false
  tags: [cis, debian_13_cis, "debian_13_cis_2.1.23", level1]

- name: Normalise listening sockets to proto:port
  ansible.builtin.set_fact:
    services_listening_ports: "{{ services_listening.stdout | regex_findall('(?m)^(\\S+).*?:(\\d+)\\s') | map('join', ':') | map('lower') | unique }}"
  tags: [cis, debian_13_cis, "debian_13_cis_2.1.23", level1]

- name: Report listening sockets
  ansible.builtin.debug:
    msg: "{{ services_listening_ports }}"
  tags: [cis, debian_13_cis, "debian_13_cis_2.1.23", level1]

- name: Fail on unapproved listening sockets
  ansible.builtin.assert:
    that: services_listening_ports | difference(services_approved_always + services_approved_listening) | length == 0
    fail_msg: >-
      Unapproved listening sockets: {{ services_listening_ports
      | difference(services_approved_always + services_approved_listening) | join(', ') }}.
      Add them to services_approved_listening or stop the service.
  when: services_approved_listening | length > 0
  tags: [cis, debian_13_cis, "debian_13_cis_2.1.23", level1]
