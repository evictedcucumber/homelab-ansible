---
- name: Ensure auditd Packages are Present
  ansible.builtin.apt:
    name: "{{ auditd_packages }}"
    state: present
- name: Enable Auditing for Processes that Start before auditd
  ansible.builtin.copy:
    src: 40-audit.cfg
    dest: /etc/default/grub.d/40-audit.cfg
    owner: root
    group: root
    mode: "0644"
  notify: Regenerate Grub
- name: Configure Audit Data Retention
  ansible.builtin.copy:
    src: auditd.conf
    dest: /etc/audit/auditd.conf
    owner: root
    group: root
    mode: "0640"
  notify: Restart auditd
- name: Neutralise the Distribution's Default audit.rules
  ansible.builtin.copy:
    src: audit.rules
    dest: /etc/audit/rules.d/audit.rules
    owner: root
    group: root
    mode: "0640"
  notify: Load Audit Rules
- name: Deploy the Audit Rules Initialiser
  ansible.builtin.copy:
    src: 01-initialize.rules
    dest: /etc/audit/rules.d/01-initialize.rules
    owner: root
    group: root
    mode: "0640"
  notify: Load Audit Rules
- name: Deploy a tmpfiles.d Rule for the faillock Watch Target
  ansible.builtin.copy:
    src: audit-faillock.tmpfiles.conf
    dest: /etc/tmpfiles.d/audit-faillock.conf
    owner: root
    group: root
    mode: "0644"
  notify: Materialise faillock
- name: Deploy the Audit Rule Set
  ansible.builtin.template:
    src: 50-default.rules.j2
    dest: /etc/audit/rules.d/50-default.rules
    owner: root
    group: root
    mode: "0640"
  notify: Load Audit Rules
- name: Deploy Audit Finalize Rule
  ansible.builtin.copy:
    src: 99-finalize.rules
    dest: /etc/audit/rules.d/99-finalize.rules
    owner: root
    group: root
    mode: "0640"
  notify: Load Audit Rules
- name: Restrict the Audit Log Directory
  ansible.builtin.file:
    path: /var/log/audit
    state: directory
    owner: root
    group: root
    mode: "0700"
- name: Find Audit Log Files
  ansible.builtin.find:
    paths: /var/log/audit
    file_type: file
  register: auditd_log_files
- name: Restrict Audit Log Files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: file
    owner: root
    group: root
    mode: "0600"
  loop: "{{ auditd_log_files.files }}"
  loop_control:
    label: "{{ item.path }}"
- name: Find Audit Configuration Files
  ansible.builtin.find:
    paths: [/etc/audit, /etc/audit/rules.d]
    patterns: ["*.conf", "*.rules"]
    file_type: file
  register: auditd_conf_files
- name: Restrict Audit Configuration Files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: file
    owner: root
    group: root
    mode: "0640"
  loop: "{{ auditd_conf_files.files }}"
  loop_control:
    label: "{{ item.path }}"
- name: Restrict Audit Tools
  ansible.builtin.file:
    path: "{{ item }}"
    state: file
    owner: root
    group: root
    mode: "0755"
  loop: "{{ auditd_tools }}"
- name: Ensure auditd is Unmasked, Enabled and Started
  ansible.builtin.systemd_service:
    name: "auditd"
    masked: false
    enabled: true
    state: started
