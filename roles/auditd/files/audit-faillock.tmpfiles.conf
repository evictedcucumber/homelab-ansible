# Managed by Ansible (role: auditd).
#
# /var/run/faillock (6.2.3 watch, key logins) lives on tmpfs and is only
# created lazily by pam_faillock on the first auth attempt after boot. Without
# this, `augenrules --load` fails on that watch rule at boot - before anyone
# has logged in yet - which fails audit-rules.service and, via Requires=,
# takes auditd.service down with it on every reboot.
d /run/faillock 0700 root root -
