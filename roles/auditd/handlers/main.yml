---
- name: Load audit rules
  ansible.builtin.command: augenrules --load
  changed_when: true
  listen: Load audit rules

- name: Restart auditd
  ansible.builtin.systemd_service:
    name: "{{ auditd_service }}"
    state: restarted
  listen: Restart auditd

# Shares its name with the bootloader role's handler so that, in a single play,
# grub is regenerated once after both roles have written their drop-ins.
- name: Regenerate grub config
  ansible.builtin.command: "{{ auditd_grub_update_command }}"
  changed_when: true
  listen: Update grub
