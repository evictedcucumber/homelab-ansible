---
- name: Load audit rules
  ansible.builtin.command: augenrules --load
  changed_when: true
  listen: Load audit rules

- name: Restart auditd
  ansible.builtin.systemd_service:
    name: "{{ auditd_service }}"
    state: restarted
  listen: Restart auditd

# GRUB regeneration for the audit cmdline drop-in is an explicit task in
# tasks/main.yml, not a handler - see the note in roles/bootloader/handlers.
