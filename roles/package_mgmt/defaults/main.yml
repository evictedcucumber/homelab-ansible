---
# roles/package_mgmt - APT repositories, key/credential access, weak deps
# (CIS Debian 13 section 1.2).

# 1.2.1.1 - replace the stock sources.list with deb822 .sources files that carry
# the Signed-By option. Files come from this role's files/sources/ directory.
package_mgmt_manage_sources: true

# 1.2.1.2 (L2) - do not pull weak (Recommends/Suggests) dependencies.
package_mgmt_disable_weak_deps: true

# 1.2.1.4 / .5 / .7 / .8 - directories that must be root:root and 0755-or-tighter.
package_mgmt_secure_dirs:
  - /etc/apt/trusted.gpg.d
  - /etc/apt/auth.conf.d
  - /etc/apt/sources.list.d
  - /usr/share/keyrings

# 1.2.1.3 - directories holding APT gpg keyrings; *gpg files locked to 0644.
package_mgmt_keyring_dirs:
  - /usr/share/keyrings
  - /etc/apt/trusted.gpg.d

# 1.2.2.1 - run a safe upgrade (only via tasks_from: upgrade.yml).
package_mgmt_upgrade_type: safe
